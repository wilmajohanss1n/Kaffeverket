<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaffeverket - Kontakt</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <!-- Sidhuvud och navigering -->
    <header>
        <a href="index.html" class="logo">Kaffeverket</a>
        <button class="menu-toggle" aria-label="Öppna menyn" aria-expanded="false">
            ☰
        </button>

        <nav class="nav-menu">
            <a href="index.html">Hem</a>
            <a href="meny.html">Meny</a>
            <a href="kontakt.html">Kontakt</a>
        </nav>
    </header>

    <!--Kontaktsektion-->
    <main class="contact-info">
        <h1>Kontakta oss</h1>
        <p>Har du frågor eller funderingar? Tveka inte att höra av dig!</p>

        <section class="contact-info">
            <h2>Kontaktuppgifter</h2>
            <p>E-post:
    <a href="mailto:kontakt@kaffeverket.se">kontakt@kaffeverket.se</a>
            </p>

            <p>Telefon:
                <a href="tel:1234567890">123-456-7890</a>
            </p>
        </section>

        <section class="opening-hours">
            <h2>Öppettider</h2>
            <p>Måndag - Fredag: 08:00 - 18:00</p>
            <p>Lördag - Söndag: 09:00 - 17:00</p>
        </section>
            
        <section class="contact-form-section">
            <h2>Skicka ett meddelande</h2>

            <form class="contact-form" novalidate>
                <label for="name">Namn:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">E-post:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Meddelande:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                  <p class="form-feedback" aria-live="polite"></p>
                <button type="submit">Skicka</button>
               
            </form>
        </section>
    </main>
 
     <!-- Sidfot -->
        <footer class="footer">
            <p>Kaffeverket</p>
        </footer>

        <script src="script.js"></script>
    
</body>
</html>
